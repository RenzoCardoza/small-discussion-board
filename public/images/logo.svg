<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500">

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.15"></feDropShadow>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="transparent"></rect>

  <g transform="translate(120 320) rotate(-4)" filter="url(#shadow)">
    <text x="0" y="0" font-family="Arial Black, Impact, sans-serif" font-size="180" font-weight="900" fill="#F45B5B" stroke="#24395A" stroke-width="28" stroke-linejoin="round" paint-order="stroke fill">
      NotReddit!
    </text>
  </g>

</svg>